<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학생 맞춤 가성비 메뉴 추천기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }

        .slot-machine-text { display: inline-block; animation: slot-spin 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes slot-spin { 0% { transform: translateY(-50px); opacity: 0; } 50% { transform: translateY(10px); opacity: 0.5; } 100% { transform: translateY(0); opacity: 1; } }

        .pop-in { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop-in { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop-in { animation: pop-in 0.35s ease-out forwards; }

        /* AI 레시피 HTML 전용 가독성 스타일 */
        #recipe-content h2 { font-size: 1.2rem; font-weight: 800; color: #1f2937; margin-top: 0.5rem; margin-bottom: 0.5rem; padding-bottom: 0.35rem; border-bottom: 2px solid #fed7aa; }
        #recipe-content h3 { font-size: 1.02rem; font-weight: 700; color: #ea580c; margin-top: 0.9rem; margin-bottom: 0.35rem; }
        #recipe-content ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        #recipe-content ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        #recipe-content li { margin-bottom: 0.3rem; }
        #recipe-content p { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <!-- Main Split Wrapper -->
    <div id="app-wrapper" class="w-full max-w-md transition-all duration-500 flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-6">
        
        <!-- Left Panel: 메뉴 추천 룰렛 -->
        <div id="menu-panel" class="w-full lg:flex-1 bg-white rounded-3xl shadow-xl overflow-hidden transition-all duration-500 flex flex-col justify-between">
            <div id="header-bg" class="bg-gray-800 text-white p-8 text-center transition-colors duration-500">
                <h1 class="text-2xl font-black mb-2 tracking-tight">오늘 뭐 먹지? 🤔</h1>
                <p class="text-sm font-medium opacity-80">대학생을 위한 가성비 메뉴 &amp; 레시피</p>
            </div>

            <div class="p-8 flex-1 flex flex-col items-center justify-center">
                <div id="result-container" class="h-32 flex items-center justify-center w-full mb-6 relative">
                    <p id="result-text" class="text-2xl font-bold text-center text-gray-800 break-keep leading-snug">아래 버튼을 눌러<br>메뉴를 추천받아보세요!</p>
                </div>

                <div id="recipe-action-container" class="w-full mb-6 hidden pop-in">
                    <button onclick="generateRecipe()" class="w-full bg-gray-800 hover:bg-black text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        AI 가성비 레시피 보기
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4 w-full">
                    <button onclick="generateRandomMenu('meal')" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-2 rounded-2xl shadow-md transition transform hover:scale-105 active:scale-95">🍚 든든한 한끼</button>
                    <button onclick="generateRandomMenu('dessert')" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-2 rounded-2xl shadow-md transition transform hover:scale-105 active:scale-95">🍰 달콤한 디저트</button>
                </div>

                <div class="mt-6 text-center text-xs text-gray-400 font-medium">
                    현재 조합 가능한 식사 <span id="meal-count" class="text-gray-600 font-bold"></span>개,<br>
                    디저트 <span id="dessert-count" class="text-gray-600 font-bold"></span>개
                </div>
            </div>
        </div>

        <!-- Right Panel: AI 레시피 & 채팅 -->
        <div id="recipe-panel" class="hidden w-full lg:flex-1 bg-white rounded-3xl shadow-xl overflow-hidden flex-col h-[75vh] min-h-[520px] max-h-[720px] animate-pop-in">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 flex-shrink-0">
                <h3 id="recipe-modal-title" class="text-lg md:text-xl font-bold text-gray-800 truncate pr-2">레시피</h3>
                <button onclick="closeRecipePanel()" title="레시피 닫기" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-lg hover:bg-gray-200/60 flex-shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-4 md:p-6 overflow-y-auto flex-1 flex flex-col bg-gray-50/50 relative" id="chat-container">
                <div id="recipe-loading" class="flex flex-col items-center justify-center h-full space-y-4">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"></div>
                    <p class="text-gray-500 font-medium animate-pulse text-center">자취생을 위한 초간단 가성비 레시피를<br>AI가 작성 중입니다... 🍳</p>
                </div>
                <div id="recipe-content" class="hidden flex-col gap-4 w-full pb-2 text-sm md:text-base"></div>
            </div>

            <div id="chat-input-area" class="hidden px-4 py-3 border-t border-gray-200 bg-white flex items-center gap-2 flex-shrink-0">
                <input type="text" id="chat-input" placeholder="재료가 없나요? AI에게 물어보세요!" class="flex-1 px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent text-sm md:text-base transition-all" onkeypress="handleKeyPress(event)">
                <button onclick="sendChatMessage()" class="p-2 bg-orange-500 hover:bg-orange-600 text-white rounded-full transition-colors flex-shrink-0 flex items-center justify-center w-10 h-10 shadow-sm transform hover:scale-105">
                    <svg class="w-5 h-5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        const SERVER_URL = "https://weathered-lab-4edf.lookc869.workers.dev/";
        let currentMenuName = "";
        let chatHistory = []; 

        // 현실적인 자취생 메뉴 데이터로 전면 교체
        const mealsData = {
            adjectives: ["가성비 갑", "스트레스 풀리는", "초간단", "든든한", "단짠단짠", "해장용", "엄마 손맛", "야식 추천", "매콤달콤", "영양 만점", "설거지 1분", "자취생 필수", "밥도둑", "국물이 끝내주는", "치즈 듬뿍", "포만감 100%", "냉파(냉장고 파먹기)", "맥주 안주로 딱인", "고소한", "비주얼 폭발"],
            menus: [
                "스팸 김치볶음밥", "참치마요 덮밥", "간장버터 계란밥", "순두부 열라면", "대패삼겹 숙주볶음", 
                "베이컨 크림우동", "전자레인지 계란찜", "참치 김치찌개", "불닭 치즈볶음면", "냉동만두 강정", 
                "식빵 컵피자", "편의점 마크정식", "짜파구리", "참치 비빔국수", "삼겹살 쌈장볶음밥", 
                "콘치즈 덮밥", "사골곰탕 만둣국", "우동사리 볶음", "치킨마요 덮밥", "김치 참치전", 
                "두부 김치", "어묵 볶음", "제육 덮밥", "소시지 야채볶음", "간장 비빔국수", 
                "로제 떡볶이(시판용)", "전자레인지 찜닭", "명란마요 덮밥", "카레라이스", "닭가슴살 볶음밥", 
                "차돌박이 된장찌개", "김치말이 국수", "대왕 유부초밥", "자취생 떡국", "두툼한 계란말이", 
                "오므라이스", "새우 볶음밥", "김치 우동", "돼지고기 김치찜", "마늘 볶음밥"
            ]
        };

        const dessertsData = {
            adjectives: ["달콤한", "상큼한", "스트레스 녹는", "시원한", "꾸덕한", "당 충전", "초간단", "홈카페", "비주얼 폭발", "부드러운", "사르르 녹는", "바삭한", "가성비 갑", "고급스러운", "쫀득한", "달달한", "상쾌한", "차가운", "사진 찍기 좋은", "입가심용"],
            menus: [
                "오레오 쉐이크", "식빵 러스크", "전자레인지 브라우니", "딸기 바나나 스무디", "요거트 볼", 
                "인절미 토스트", "초코파이 미니케이크", "아이스크림 호떡", "크림치즈 크래커", "우유 컵빙수", 
                "달고나 커피", "사이다 과일화채", "핫케이크", "바닐라 아이스크림", "시리얼 파르페", 
                "얼음 동동 미숫가루", "식빵 츄러스", "냉동망고 연유빙수", "아포가토", "요구르트 샤베트", 
                "누텔라 바나나 토스트", "에어프라이어 홈런볼", "아이스 홍시", "과일 요거트 샐러드", "미니 치즈케이크(편의점)"
            ]
        };

        window.onload = () => {
            document.getElementById('meal-count').innerText = (mealsData.adjectives.length * mealsData.menus.length).toLocaleString();
            document.getElementById('dessert-count').innerText = (dessertsData.adjectives.length * dessertsData.menus.length).toLocaleString();
        };

        function getRandomItem(array) { return array[Math.floor(Math.random() * array.length)]; }

        function generateRandomMenu(type) {
            const resultText = document.getElementById('result-text');
            const headerBg = document.getElementById('header-bg');
            const recipeActionContainer = document.getElementById('recipe-action-container');
            
            recipeActionContainer.classList.add('hidden');
            recipeActionContainer.classList.remove('pop-in');

            let data = type === 'meal' ? mealsData : dessertsData;
            headerBg.className = type === 'meal' ? 'bg-orange-500 text-white p-8 text-center transition-colors duration-500' : 'bg-purple-500 text-white p-8 text-center transition-colors duration-500';

            let shuffleCount = 0;
            const shuffleInterval = setInterval(() => {
                // 수식어 + 메뉴로만 표시
                resultText.innerText = `${getRandomItem(data.adjectives)}\n${getRandomItem(data.menus)}`;
                resultText.style.opacity = '0.5';
                
                shuffleCount++;
                if (shuffleCount > 10) {
                    clearInterval(shuffleInterval);
                    const finalAdj = getRandomItem(data.adjectives);
                    const finalMenu = getRandomItem(data.menus);
                    currentMenuName = `${finalAdj} ${finalMenu}`; 
                    
                    resultText.innerHTML = `<span class="slot-machine-text text-${type === 'meal' ? 'orange' : 'purple'}-600">${finalAdj}</span> <br> <span class="slot-machine-text" style="animation-delay: 0.1s">${finalMenu}</span>`;
                    resultText.style.opacity = '1';

                    setTimeout(() => {
                        recipeActionContainer.classList.remove('hidden');
                        recipeActionContainer.classList.add('pop-in');
                    }, 400);
                }
            }, 50);
        }

        function appendMessage(sender, text) {
            const content = document.getElementById('recipe-content');
            const msgDiv = document.createElement('div');
            
            if (sender === 'user') {
                msgDiv.className = "self-end bg-orange-100 text-orange-900 px-4 py-3 rounded-2xl rounded-tr-sm max-w-[85%] shadow-sm break-words";
                msgDiv.textContent = text; 
            } else if (sender === 'ai') {
                msgDiv.className = "self-start bg-white border border-gray-200 text-gray-700 px-5 py-4 rounded-2xl rounded-tl-sm w-full shadow-sm leading-relaxed";
                msgDiv.innerHTML = text;
            } else {
                msgDiv.className = "self-center text-red-500 font-semibold text-center w-full py-2 bg-red-50 rounded-xl break-all";
                msgDiv.innerHTML = text;
            }
            content.appendChild(msgDiv);
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendChatMessage(); }

        async function generateRecipe() {
            const wrapper = document.getElementById('app-wrapper');
            const panel = document.getElementById('recipe-panel');
            const loading = document.getElementById('recipe-loading');
            const content = document.getElementById('recipe-content');
            const title = document.getElementById('recipe-modal-title');
            const chatInputArea = document.getElementById('chat-input-area');
            const chatInput = document.getElementById('chat-input');

            wrapper.classList.remove('max-w-md');
            wrapper.classList.add('max-w-5xl');
            panel.classList.remove('hidden');
            panel.classList.add('flex');

            title.textContent = `"${currentMenuName}" 레시피 👩‍🍳`;
            loading.classList.remove('hidden');
            content.classList.add('hidden');
            content.classList.remove('flex');
            chatInputArea.classList.add('hidden');
            chatInputArea.classList.remove('flex');
            chatInput.value = "";
            
            content.innerHTML = ''; 
            chatHistory = []; 

            if (window.innerWidth < 1024) {
                setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
            }

            const firstPrompt = `당신은 좁은 원룸에 사는 가난한 대학생을 위한 최고의 자취 요리 전문가입니다. 
오늘의 추천 메뉴는 "${currentMenuName}"입니다. 이 메뉴를 만들 수 있는 초간단, 가성비 레시피를 알려주세요.
비싼 재료는 절대 사용하지 말고, 편의점이나 동네 마트에서 쉽게 구할 수 있는 대체재를 활용하세요. 조리 도구는 전자레인지나 프라이팬 하나로 끝낼 수 있게 아주 간단해야 합니다. 
응답은 웹페이지에 바로 삽입되므로 마크다운 대신 깔끔한 HTML 태그(<h2>, <h3>, <ul>, <li>, <strong>, <br> 등)만을 사용하여 가독성 좋게 출력해주세요. 불필요한 마크다운 백틱(\`\`\`html)은 절대 넣지 마세요.`;
            
            chatHistory.push({ role: "user", parts: [{ text: firstPrompt }] });

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`서버 응답 오류 (상태코드: ${response.status}) - ${errorText}`);
                }
                
                const result = await response.json();
                let aiText = result.candidates[0].content.parts[0].text.replace(/```html/g, '').replace(/```/g, ''); 
                
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                appendMessage('ai', aiText);
                chatInputArea.classList.remove('hidden');
                chatInputArea.classList.add('flex');
                
            } catch (error) {
                console.error("API Error:", error);
                appendMessage('error', `🚨 진짜 에러 원인: <br><span class="text-xs text-gray-500">${error.message}</span>`);
            } finally {
                loading.classList.add('hidden');
                content.classList.remove('hidden');
                content.classList.add('flex');
                setTimeout(() => chatInput.focus(), 100);
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            input.disabled = true;
            appendMessage('user', text);
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            
            const content = document.getElementById('recipe-content');
            const loadingBubble = document.createElement('div');
            loadingBubble.id = "chat-typing-indicator";
            loadingBubble.className = "self-start bg-white border border-gray-100 px-5 py-4 rounded-2xl rounded-tl-sm shadow-sm flex gap-2 items-center";
            loadingBubble.innerHTML = '<span class="animate-bounce w-2 h-2 bg-orange-400 rounded-full"></span><span class="animate-bounce w-2 h-2 bg-orange-400 rounded-full" style="animation-delay: 0.2s"></span><span class="animate-bounce w-2 h-2 bg-orange-400 rounded-full" style="animation-delay: 0.4s"></span>';
            content.appendChild(loadingBubble);
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`서버 에러 (${response.status}) - ${errorText}`);
                }

                const result = await response.json();
                loadingBubble.remove();
                
                let aiText = result.candidates[0].content.parts[0].text.replace(/```html/g, '').replace(/```/g, '');
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                appendMessage('ai', aiText);
            } catch (error) {
                console.error("API Error:", error);
                loadingBubble.remove();
                appendMessage('error', `🚨 진짜 에러 원인: <br><span class="text-xs text-gray-500">${error.message}</span>`);
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        function closeRecipePanel() {
            const wrapper = document.getElementById('app-wrapper');
            const panel = document.getElementById('recipe-panel');
            
            panel.classList.add('hidden');
            panel.classList.remove('flex');
            wrapper.classList.remove('max-w-5xl');
            wrapper.classList.add('max-w-md');
        }
    </script>
</body>
</html>
