<script>
  // 1. 기존에 만든 Cloudflare Worker 주소로 복구
  const SERVER_URL = "https://weathered-lab-4edf.lookc869.workers.dev/";
  
  let chatHistory = [];

  function closeModal() {
      document.getElementById('recipe-modal').style.display = 'none';
  }

  async function requestRecipe(elementId) {
      const menuName = document.getElementById(elementId).innerText;
      if (menuName === "버튼을 눌러주세요!") {
          alert("먼저 메뉴를 추천받아주세요!");
          return;
      }

      const modal = document.getElementById('recipe-modal');
      const chatBox = document.getElementById('chat-box');
      modal.style.display = 'block';
      chatBox.innerHTML = `<div class="message system-message">🍳 <b>${menuName}</b> 자취생 맞춤 레시피를 불러오는 중입니다...</div>`;
      
      chatHistory = [];
      const firstPrompt = `대학생 자취생이 쉽고 싸게 만들 수 있는 '${menuName}' 레시피를 알려줘. 친근하고 유쾌한 말투로 설명해줘.`;
      
      await sendMessageToAI(firstPrompt, true);
  }

  async function sendMessageToAI(text, isFirstMessage = false) {
      const chatBox = document.getElementById('chat-box');
      
      if (!isFirstMessage) {
          chatBox.innerHTML += `<div class="message user-message">${text}</div>`;
          chatBox.scrollTop = chatBox.scrollHeight;
      }

      chatHistory.push({ role: "user", parts: [{ text: text }] });

      try {
          const response = await fetch(SERVER_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: chatHistory }) 
          });

          if (!response.ok) throw new Error("서버 응답 오류");
          const data = await response.json();

          const aiReply = data.candidates[0].content.parts[0].text;
          
          chatHistory.push({ role: "model", parts: [{ text: aiReply }] });

          if (isFirstMessage) chatBox.innerHTML = '';
          const formattedReply = aiReply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
          chatBox.innerHTML += `<div class="message ai-message">${formattedReply}</div>`;
          chatBox.scrollTop = chatBox.scrollHeight;

      } catch (error) {
          chatBox.innerHTML += `<div class="message ai-message" style="color:red;">앗, 레시피를 가져오는데 문제가 생겼어요! 서버 연결을 확인해주세요.</div>`;
          chatBox.scrollTop = chatBox.scrollHeight;
      }
  }

  function submitChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (text) {
          sendMessageToAI(text);
          input.value = '';
      }
  }
</script>
